name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install
        run: |
          npm ci || npm install
        working-directory: kabislab-blog

      - name: Build
        run: npm run build
        working-directory: kabislab-blog

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kabislab-blog-dist
          path: kabislab-blog/dist
